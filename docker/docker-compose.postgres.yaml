services:
  app:
    environment:
      DB_PROVIDER: postgres
      DB_POSTGRES_URL: postgresql://mungchilog:mungchilog@postgres:5432/mungchilog
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: mungchilog
      POSTGRES_USER: mungchilog
      POSTGRES_PASSWORD: mungchilog
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mungchilog -d mungchilog"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - mungchilog-postgres-data:/var/lib/postgresql/data

volumes:
  mungchilog-postgres-data:
