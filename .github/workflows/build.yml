name: Build and push app image

on:
  push:
    branches: [main]
    paths:
      - "apps/**"
      - ".github/workflows/build.yml"
  workflow_dispatch: {}

# A later arm64/QEMU build must not finish after a newer main commit and become
# Image Updater's newest-build candidate. Cancel superseded work so the newest
# completed run represents the newest main revision.
concurrency:
  group: build-main
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Compute immutable image tag
        id: image_tag
        shell: bash
        run: |
          short_sha="$(git rev-parse --short=7 "$GITHUB_SHA")"
          echo "value=${GITHUB_RUN_NUMBER}-${short_sha}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/server/Dockerfile
          platforms: linux/arm64
          push: true
          build-args: |
            VITE_GOOGLE_MAPS_API_KEY=${{ secrets.VITE_GOOGLE_MAPS_API_KEY }}
          tags: |
            ${{ env.IMAGE }}:${{ steps.image_tag.outputs.value }}
