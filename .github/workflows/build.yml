name: Build and push app image

on:
  push:
    branches: [dev]
    paths:
      - "apps/**"
      - ".dockerignore"
      - ".github/workflows/build.yml"
  pull_request:
    branches: [dev, stg, prd]
    paths:
      - "apps/**"
      - ".dockerignore"
      - ".github/workflows/build.yml"
  workflow_dispatch: {}

# A later dev build must not finish after a newer dev commit and become Image
# Updater's newest-build candidate. Cancel superseded work so the newest
# completed run represents the newest development revision.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository }}-dev

jobs:
  metadata:
    runs-on: ubuntu-26.04
    outputs:
      image_tag: ${{ steps.image_tag.outputs.value }}
      build_env: ${{ steps.build_info.outputs.environment }}
      build_number: ${{ github.run_number }}
      commit_sha: ${{ steps.build_info.outputs.commit_sha }}
      build_branch: ${{ github.ref_name }}
      build_time: ${{ steps.build_info.outputs.build_time }}
      release_version: ${{ steps.build_info.outputs.release_version }}
      publish: ${{ steps.publish.outputs.value }}
    steps:
      - uses: actions/checkout@v4

      - name: Compute immutable image tag
        id: image_tag
        shell: bash
        run: |
          short_sha="$(git rev-parse --short=7 "$GITHUB_SHA")"
          echo "value=r${GITHUB_RUN_NUMBER}-${short_sha}" >> "$GITHUB_OUTPUT"

      - name: Compute public build metadata
        id: build_info
        shell: bash
        run: |
          case "$GITHUB_REF_NAME" in
            dev) environment=dev ;;
            stg) environment=stg ;;
            prd|main) environment=prd ;;
            *) environment=local ;;
          esac
          short_sha="$(git rev-parse --short=7 "$GITHUB_SHA")"
          # Production versions are supplied only by the promotion workflow.
          # This synthetic value lets a pull-request build validate the final
          # metadata-file layer without publishing a production image.
          if [[ "$environment" == "prd" ]]; then
            release_version=v0.0.0
          else
            release_version=""
          fi
          {
            echo "environment=$environment"
            echo "commit_sha=$short_sha"
            echo "build_time=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "release_version=$release_version"
          } >> "$GITHUB_OUTPUT"

      # Pull requests and manual dispatches only validate. New deployable
      # images originate exclusively from the development package. Promotion
      # promotes the verified source image by adding only a deployment metadata
      # layer. It never recompiles the frontend application bundle.
      - name: Decide whether this run may publish
        id: publish
        run: echo "value=${{ github.ref == 'refs/heads/dev' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}" >> "$GITHUB_OUTPUT"

  validate:
    needs: metadata
    if: needs.metadata.outputs.publish != 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-26.04
            cache_scope: mungchilog-linux-amd64
            artifact_suffix: amd64
          - platform: linux/arm64
            runner: ubuntu-26.04-arm
            cache_scope: mungchilog-linux-arm64
            artifact_suffix: arm64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build platform image without publishing
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/server/Dockerfile
          platforms: ${{ matrix.platform }}
          cache-from: type=gha,scope=${{ matrix.cache_scope }}
          cache-to: type=gha,mode=max,scope=${{ matrix.cache_scope }}
          build-args: |
            VITE_GOOGLE_MAPS_API_KEY=${{ secrets.VITE_GOOGLE_MAPS_API_KEY }}
            BUILD_ENV=${{ needs.metadata.outputs.build_env }}
            BUILD_NUMBER=${{ needs.metadata.outputs.build_number }}
            IMAGE_TAG=${{ needs.metadata.outputs.image_tag }}
            COMMIT_SHA=${{ needs.metadata.outputs.commit_sha }}
            BUILD_BRANCH=${{ needs.metadata.outputs.build_branch }}
            BUILD_TIME=${{ needs.metadata.outputs.build_time }}
            RELEASE_VERSION=${{ needs.metadata.outputs.release_version }}

  build:
    needs: metadata
    if: needs.metadata.outputs.publish == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-26.04
            cache_scope: mungchilog-linux-amd64
            artifact_suffix: amd64
          - platform: linux/arm64
            runner: ubuntu-26.04-arm
            cache_scope: mungchilog-linux-arm64
            artifact_suffix: arm64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push platform image by digest
        id: build_push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/server/Dockerfile
          platforms: ${{ matrix.platform }}
          # Do not tag either platform image. The finalize job creates the
          # sole deployable tag after both native images are available.
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.cache_scope }}
          cache-to: type=gha,mode=max,scope=${{ matrix.cache_scope }}
          build-args: |
            VITE_GOOGLE_MAPS_API_KEY=${{ secrets.VITE_GOOGLE_MAPS_API_KEY }}
            BUILD_ENV=${{ needs.metadata.outputs.build_env }}
            BUILD_NUMBER=${{ needs.metadata.outputs.build_number }}
            IMAGE_TAG=${{ needs.metadata.outputs.image_tag }}
            COMMIT_SHA=${{ needs.metadata.outputs.commit_sha }}
            BUILD_BRANCH=${{ needs.metadata.outputs.build_branch }}
            BUILD_TIME=${{ needs.metadata.outputs.build_time }}
            RELEASE_VERSION=${{ needs.metadata.outputs.release_version }}

      - name: Export platform digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build_push.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload platform digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.artifact_suffix }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  finalize:
    needs: [metadata, build]
    if: needs.metadata.outputs.publish == 'true'
    runs-on: ubuntu-26.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Download platform digests
        uses: actions/download-artifact@v4
        with:
          pattern: digests-*
          merge-multiple: true
          path: /tmp/digests

      - name: Publish multi-architecture image manifest
        env:
          IMAGE_TAG: ${{ needs.metadata.outputs.image_tag }}
        run: |
          shopt -s nullglob
          digest_files=(/tmp/digests/*)
          test "${#digest_files[@]}" -eq 2

          references=()
          for digest_file in "${digest_files[@]}"; do
            digest="$(basename "$digest_file")"
            [[ "$digest" =~ ^[a-f0-9]{64}$ ]]
            references+=("${IMAGE}@sha256:${digest}")
          done

          docker buildx imagetools create \
            --tag "${IMAGE}:${IMAGE_TAG}" \
            "${references[@]}"

      - name: Verify Linux amd64 and arm64 manifest variants
        env:
          IMAGE_TAG: ${{ needs.metadata.outputs.image_tag }}
        run: |
          docker buildx imagetools inspect "${IMAGE}:${IMAGE_TAG}" --raw | jq -e '
            [.manifests[].platform
             | select(.os == "linux")
             | .architecture]
            | sort == ["amd64", "arm64"]
          '
