name: Promote app image

on:
  workflow_dispatch:
    inputs:
      source_tag:
        description: Immutable image tag from the preceding environment
        required: true
        type: string
      target:
        description: Environment that receives the existing OCI manifest
        required: true
        type: choice
        options:
          - stg
          - prd
      release_version:
        description: Stable semantic version for a production promotion, for example v1.2.3
        required: false
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: promote-${{ inputs.target }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  promote:
    # Run the dispatch from the target environment branch. The branch contains
    # the reviewed deployment configuration, while source_tag identifies the
    # already-built image to copy.
    if: github.ref == format('refs/heads/{0}', inputs.target)
    runs-on: ubuntu-26.04-arm
    environment:
      name: ${{ inputs.target }}
    steps:
      - name: Validate promotion path and target tag
        id: metadata
        shell: bash
        env:
          SOURCE_TAG: ${{ inputs.source_tag }}
          TARGET: ${{ inputs.target }}
          RELEASE_VERSION: ${{ inputs.release_version }}
        run: |
          case "$TARGET" in
            stg)
              if [[ ! "$SOURCE_TAG" =~ ^dev-r[0-9]+-[0-9a-f]{7}$ ]]; then
                echo "stg promotion requires a dev-r<run>-<sha> source tag" >&2
                exit 1
              fi

              if [[ -n "$RELEASE_VERSION" ]]; then
                echo "release_version is only valid for production promotion" >&2
                exit 1
              fi

              source_revision="${SOURCE_TAG##*-}"
              echo "target_tag=stg-r${GITHUB_RUN_NUMBER}-${source_revision}" >> "$GITHUB_OUTPUT"
              echo "alias_tag=" >> "$GITHUB_OUTPUT"
              ;;
            prd)
              if [[ ! "$SOURCE_TAG" =~ ^stg-r[0-9]+-[0-9a-f]{7}$ ]]; then
                echo "production promotion requires a stg-r<run>-<sha> source tag" >&2
                exit 1
              fi

              if [[ ! "$RELEASE_VERSION" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
                echo "production promotion requires release_version in stable vMAJOR.MINOR.PATCH form" >&2
                exit 1
              fi

              source_revision="${SOURCE_TAG##*-}"
              echo "target_tag=${RELEASE_VERSION}-r${GITHUB_RUN_NUMBER}-${source_revision}" >> "$GITHUB_OUTPUT"
              echo "alias_tag=${RELEASE_VERSION}" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "Unsupported promotion target: $TARGET" >&2
              exit 1
              ;;
          esac

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Copy the multi-architecture OCI manifest
        env:
          SOURCE_TAG: ${{ inputs.source_tag }}
          TARGET_TAG: ${{ steps.metadata.outputs.target_tag }}
          ALIAS_TAG: ${{ steps.metadata.outputs.alias_tag }}
        run: |
          source_ref="${IMAGE}:${SOURCE_TAG}"
          source_digest="$(
            docker buildx imagetools inspect "$source_ref" \
              | awk '$1 == "Digest:" { print $2; exit }'
          )"
          test -n "$source_digest"

          target_tags=("$TARGET_TAG")
          if [[ -n "$ALIAS_TAG" ]]; then
            target_tags+=("$ALIAS_TAG")
          fi

          tag_args=()
          for tag in "${target_tags[@]}"; do
            target_ref="${IMAGE}:${tag}"
            existing_digest="$(
              docker buildx imagetools inspect "$target_ref" 2>/dev/null \
                | awk '$1 == "Digest:" { print $2; exit }' \
                || true
            )"

            if [[ -n "$existing_digest" && "$existing_digest" != "$source_digest" ]]; then
              echo "Refusing to move immutable tag ${tag} from ${existing_digest} to ${source_digest}" >&2
              exit 1
            fi

            tag_args+=(--tag "$target_ref")
          done

          docker buildx imagetools create "${tag_args[@]}" "$source_ref"

      - name: Verify manifest identity and platform variants
        env:
          SOURCE_TAG: ${{ inputs.source_tag }}
          TARGET_TAG: ${{ steps.metadata.outputs.target_tag }}
          ALIAS_TAG: ${{ steps.metadata.outputs.alias_tag }}
        run: |
          docker buildx imagetools inspect "${IMAGE}:${SOURCE_TAG}" --raw > /tmp/source-manifest.json

          target_tags=("$TARGET_TAG")
          if [[ -n "$ALIAS_TAG" ]]; then
            target_tags+=("$ALIAS_TAG")
          fi

          for tag in "${target_tags[@]}"; do
            target_manifest="/tmp/target-${tag//[^a-zA-Z0-9._-]/_}.json"
            docker buildx imagetools inspect "${IMAGE}:${tag}" --raw > "$target_manifest"
            cmp /tmp/source-manifest.json "$target_manifest"
            jq -e '
              [.manifests[].platform
               | select(.os == "linux")
               | .architecture]
              | sort == ["amd64", "arm64"]
            ' "$target_manifest"
          done
