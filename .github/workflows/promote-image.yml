name: Promote app image

on:
  workflow_dispatch:
    inputs:
      source_tag:
        description: Immutable image tag from the preceding environment
        required: true
        type: string
      target:
        description: Environment that receives the existing OCI manifest
        required: true
        type: choice
        options:
          - stg
          - prd

permissions:
  contents: read
  packages: write

concurrency:
  group: promote-${{ inputs.target }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  promote:
    # Run the dispatch from the target environment branch. The branch contains
    # the reviewed deployment configuration, while source_tag identifies the
    # already-built image to copy.
    if: github.ref == format('refs/heads/{0}', inputs.target)
    runs-on: ubuntu-26.04-arm
    environment:
      name: ${{ inputs.target }}
    steps:
      - name: Validate promotion path and target tag
        id: metadata
        shell: bash
        env:
          SOURCE_TAG: ${{ inputs.source_tag }}
          TARGET: ${{ inputs.target }}
        run: |
          case "$TARGET" in
            stg)
              [[ "$SOURCE_TAG" =~ ^dev-[0-9]+-[0-9a-f]{7}$ ]]
              ;;
            prd)
              [[ "$SOURCE_TAG" =~ ^stg-[0-9]+-[0-9a-f]{7}$ ]]
              ;;
            *)
              echo "Unsupported promotion target: $TARGET" >&2
              exit 1
              ;;
          esac

          source_revision="${SOURCE_TAG##*-}"
          echo "target_tag=${TARGET}-${GITHUB_RUN_NUMBER}-${source_revision}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Copy the multi-architecture OCI manifest
        env:
          SOURCE_TAG: ${{ inputs.source_tag }}
          TARGET_TAG: ${{ steps.metadata.outputs.target_tag }}
        run: |
          docker buildx imagetools create \
            --tag "${IMAGE}:${TARGET_TAG}" \
            "${IMAGE}:${SOURCE_TAG}"

      - name: Verify manifest identity and platform variants
        env:
          SOURCE_TAG: ${{ inputs.source_tag }}
          TARGET_TAG: ${{ steps.metadata.outputs.target_tag }}
        run: |
          docker buildx imagetools inspect "${IMAGE}:${SOURCE_TAG}" --raw > /tmp/source-manifest.json
          docker buildx imagetools inspect "${IMAGE}:${TARGET_TAG}" --raw > /tmp/target-manifest.json
          cmp /tmp/source-manifest.json /tmp/target-manifest.json
          jq -e '
            [.manifests[].platform
             | select(.os == "linux")
             | .architecture]
            | sort == ["amd64", "arm64"]
          ' /tmp/target-manifest.json
