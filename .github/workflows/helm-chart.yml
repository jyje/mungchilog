name: Validate Helm chart

on:
  pull_request:
    paths:
      - "charts/mungchilog/**"
      - ".github/workflows/helm-chart.yml"
  push:
    branches: [dev]
    paths:
      - "charts/mungchilog/**"
      - ".github/workflows/helm-chart.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - run: helm lint charts/mungchilog
      - run: helm template mungchilog charts/mungchilog > /tmp/mungchilog-sqlite.yaml

      # Release contract: a rendered deployment always names an immutable
      # build. The default comes from Chart.appVersion, and `latest` - which
      # the promotion workflow never publishes - must not appear.
      - name: Default image resolves to Chart.appVersion
        run: |
          app_version="$(helm show chart charts/mungchilog | sed -n 's/^appVersion: *"\{0,1\}\([^"]*\)"\{0,1\}$/\1/p')"
          test -n "$app_version"
          rendered="$(grep -E '^\s+image:' /tmp/mungchilog-sqlite.yaml | sort -u)"
          echo "appVersion=$app_version"
          echo "$rendered"
          test "$(echo "$rendered" | wc -l)" -eq 1
          echo "$rendered" | grep -q ":${app_version}\"$"
      - name: Digest pin takes precedence and stays readable
        run: |
          digest="sha256:$(printf 'a%.0s' $(seq 64))"
          helm template mungchilog charts/mungchilog \
            --set image.digest="$digest" \
            | grep -E '^\s+image:' | sort -u | grep -q "mungchilog@${digest}\"$"
          helm template mungchilog charts/mungchilog \
            --set image.tag=v9.9.9 --set image.digest="$digest" \
            | grep -E '^\s+image:' | sort -u | grep -q "mungchilog:v9.9.9@${digest}\"$"
      - name: Schema rejects a malformed digest
        run: >-
          ! helm template mungchilog charts/mungchilog --set image.digest=notadigest
      - name: Chart packages cleanly
        run: helm package charts/mungchilog --destination /tmp/chart-package
      - run: >-
          helm template mungchilog charts/mungchilog
          --set locationSharing.enabled=true
          --set replicaCount=1
          > /tmp/mungchilog-location-sharing.yaml
      - run: >-
          ! helm template mungchilog charts/mungchilog
          --set locationSharing.enabled=true
          --set replicaCount=2
      - run: >-
          ! helm template mungchilog charts/mungchilog
          --set 'extraEnv[0].name=LOCATION_SHARING_ENABLED'
          --set 'extraEnv[0].value=true'
      - run: >-
          helm template mungchilog charts/mungchilog
          --set database.provider=postgres
          --set database.postgres.existingSecret=mungchilog-postgres
          --set database.postgres.connectionMode=components
          > /tmp/mungchilog-postgres.yaml
      - run: >-
          helm template mungchilog charts/mungchilog
          --set serviceAccount.create=true
          --set serviceAccount.name=mungchilog-monitoring
          --set usageMonitoring.googleCloud.enabled=true
          --set usageMonitoring.googleCloud.projectId=example-project
          --set usageMonitoring.googleCloud.workloadIdentity.enabled=true
          --set-string usageMonitoring.googleCloud.workloadIdentity.audience=https://iam.googleapis.com/projects/123/locations/global/workloadIdentityPools/example/providers/kubernetes
          --set usageMonitoring.googleCloud.workloadIdentity.credentialConfigMap=mungchilog-google-wif
          > /tmp/mungchilog-google-monitoring.yaml
      # Disabled by default - not part of the routine sync, only an Ops
      # decision. Templates for both database providers so a future one
      # doesn't silently drop the other's env wiring.
      - run: >-
          ! helm template mungchilog charts/mungchilog | grep -q "kind: Job"
      - run: >-
          helm template mungchilog charts/mungchilog
          --set migration.spotTimeFields.enabled=true
          --set migration.spotTimeFields.dryRun=true
          > /tmp/mungchilog-migration-sqlite.yaml
      - run: >-
          helm template mungchilog charts/mungchilog
          --set migration.spotTimeFields.enabled=true
          --set database.provider=postgres
          --set database.postgres.existingSecret=mungchilog-postgres
          --set database.postgres.connectionMode=components
          > /tmp/mungchilog-migration-postgres.yaml

      # Every scenario rendered above, checked once: no moving tag reaches a
      # manifest. `latest` still exists in the registry from before the
      # release contract, so this stays an explicit check rather than an
      # assumption about what the promotion workflow publishes.
      - name: No moving tag in any rendered scenario
        run: >-
          ! grep -rE '^[[:space:]]+image:.*:latest"?$' /tmp/mungchilog-*.yaml
