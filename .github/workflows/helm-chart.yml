name: Validate Helm chart

on:
  pull_request:
    paths:
      - "charts/mungchilog/**"
      - ".github/workflows/helm-chart.yml"
  push:
    branches: [dev]
    paths:
      - "charts/mungchilog/**"
      - ".github/workflows/helm-chart.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - run: helm lint charts/mungchilog
      - run: helm template mungchilog charts/mungchilog > /tmp/mungchilog-sqlite.yaml
      - run: >-
          helm template mungchilog charts/mungchilog
          --set locationSharing.enabled=true
          --set replicaCount=1
          > /tmp/mungchilog-location-sharing.yaml
      - run: >-
          ! helm template mungchilog charts/mungchilog
          --set locationSharing.enabled=true
          --set replicaCount=2
      - run: >-
          ! helm template mungchilog charts/mungchilog
          --set 'extraEnv[0].name=LOCATION_SHARING_ENABLED'
          --set 'extraEnv[0].value=true'
      - run: >-
          helm template mungchilog charts/mungchilog
          --set database.provider=postgres
          --set database.postgres.existingSecret=mungchilog-postgres
          --set database.postgres.connectionMode=components
          > /tmp/mungchilog-postgres.yaml
      - run: >-
          helm template mungchilog charts/mungchilog
          --set serviceAccount.create=true
          --set serviceAccount.name=mungchilog-monitoring
          --set usageMonitoring.googleCloud.enabled=true
          --set usageMonitoring.googleCloud.projectId=example-project
          --set usageMonitoring.googleCloud.workloadIdentity.enabled=true
          --set-string usageMonitoring.googleCloud.workloadIdentity.audience=https://iam.googleapis.com/projects/123/locations/global/workloadIdentityPools/example/providers/kubernetes
          --set usageMonitoring.googleCloud.workloadIdentity.credentialConfigMap=mungchilog-google-wif
          > /tmp/mungchilog-google-monitoring.yaml
