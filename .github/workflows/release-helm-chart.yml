name: Release Helm chart

on:
  push:
    branches: [prd]
    paths:
      - "charts/mungchilog/**"

permissions:
  contents: read
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      CHART_DIR: charts/mungchilog
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - run: helm lint "$CHART_DIR"
      - run: helm package "$CHART_DIR" --destination .chart-release
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: helm push .chart-release/mungchilog-*.tgz oci://ghcr.io/${{ github.repository_owner }}/charts
