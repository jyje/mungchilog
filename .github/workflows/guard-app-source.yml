name: Guard app-source commits on stg/prd

# apps/** only ever becomes a deployable image by being built on dev and
# then promoted forward by promote-image.yml (see build.yml's `publish`
# gate, which fires exclusively on `refs/heads/dev`). A commit that touches
# apps/** and lands on stg or prd without ever having existed on dev would
# build nothing, ship nothing, and just sit in the branch silently drifting
# from whatever is actually deployed. This workflow catches that commit
# before it merges (pull_request) or right after it lands (push, since
# neither branch has protection rules blocking a direct push).

on:
  pull_request:
    branches: [stg, prd]
    paths:
      - "apps/**"
  push:
    branches: [stg, prd]
    paths:
      - "apps/**"

jobs:
  guard:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Every apps/** commit here must already be on dev
        shell: bash
        run: |
          git fetch origin dev --quiet

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            range="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
          else
            before="${{ github.event.before }}"
            after="${{ github.event.after }}"
            # A branch's first push (or a force-push GitHub can't diff) reports
            # an all-zero `before`. Fall back to just the tip commit rather
            # than trying to diff against nothing.
            if [[ "$before" =~ ^0+$ ]]; then
              range="${after}~1..${after}"
            else
              range="${before}..${after}"
            fi
          fi

          bad=0
          while read -r sha; do
            [ -z "$sha" ] && continue
            # Plain diff-tree on a merge commit reports no files, which is
            # exactly what we want: a merge that carries dev's own commits
            # forward (dev->stg, stg->prd) must not be flagged itself - its
            # individual commits are checked on their own below.
            if git diff-tree --no-commit-id --name-only -r "$sha" | grep -q '^apps/'; then
              if ! git merge-base --is-ancestor "$sha" origin/dev; then
                echo "::error::commit $sha touches apps/** but has never existed on dev."
                git show -s --format='  %h %s' "$sha"
                bad=1
              fi
            fi
          done < <(git rev-list "$range")

          if [ "$bad" -ne 0 ]; then
            echo ""
            echo "apps/** changes must land on dev first, then reach this branch"
            echo "through the normal dev -> stg -> prd promotion (see AGENTS.md,"
            echo "'Environment branches'). This branch only builds images from"
            echo "commits dev has already produced - a commit invented here would"
            echo "never be built or deployed, and would silently disappear the"
            echo "next time dev is promoted forward."
            exit 1
          fi
