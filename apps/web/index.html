<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/pwa-192.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#111214" />
    <title>뭉치로그</title>
    <script>
      // Applies the saved light/dark choice (or system default) before the
      // first paint, so switching pages/reloading never flashes the wrong
      // theme. Mirrored at runtime by ThemeToggle.tsx.
      (function () {
        try {
          var v = localStorage.getItem("mungchilog-theme");
          if (v === "light" || v === "dark") document.documentElement.setAttribute("data-theme", v);
          var dark = v === "dark" || (v !== "light" && typeof window.matchMedia === "function" && window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.classList.toggle("dark", dark);
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute("content", dark ? "#111214" : "#f5f6f8");
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
