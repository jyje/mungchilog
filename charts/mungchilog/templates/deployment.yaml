{{- $monitoring := .Values.usageMonitoring.googleCloud -}}
{{- $workloadIdentity := $monitoring.workloadIdentity -}}
{{- $locationSharing := .Values.locationSharing -}}
{{- if and $workloadIdentity.enabled (not $monitoring.enabled) -}}
{{- fail "usageMonitoring.googleCloud.enabled must be true when workloadIdentity is enabled" -}}
{{- end -}}
{{- if and $workloadIdentity.enabled (not (or .Values.serviceAccount.create .Values.serviceAccount.name)) -}}
{{- fail "serviceAccount.create or serviceAccount.name is required for Google workload identity" -}}
{{- end -}}
{{- if and $locationSharing.enabled (ne (int .Values.replicaCount) 1) -}}
{{- fail "locationSharing.enabled requires replicaCount: 1 because coordinates are held only in process memory" -}}
{{- end -}}
{{- range .Values.extraEnv -}}
{{- if or (eq .name "LOCATION_SHARING_ENABLED") (eq .name "LOCATION_SHARING_SINGLE_PROCESS") -}}
{{- fail "configure location sharing only through locationSharing.enabled, not extraEnv" -}}
{{- end -}}
{{- end -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mungchilog
  labels:
    app: mungchilog
spec:
  replicas: {{ .Values.replicaCount }}
  {{- if $locationSharing.enabled }}
  # Recreate prevents a rolling update from running two independent in-memory
  # stores. That would make revocation and recipient visibility ambiguous.
  strategy:
    type: Recreate
  {{- end }}
  selector:
    matchLabels:
      app: mungchilog
  template:
    metadata:
      labels:
        app: mungchilog
    spec:
      {{- if or .Values.serviceAccount.create .Values.serviceAccount.name }}
      serviceAccountName: {{ default "mungchilog" .Values.serviceAccount.name }}
      {{- end }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
      containers:
        - name: mungchilog
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.targetPort }}
          env:
            - name: PORT
              value: "{{ .Values.service.targetPort }}"
            - name: LOCATION_SHARING_ENABLED
              value: {{ ternary "true" "false" $locationSharing.enabled | quote }}
            - name: LOCATION_SHARING_SINGLE_PROCESS
              value: {{ ternary "true" "false" $locationSharing.enabled | quote }}
            - name: DB_PROVIDER
              value: {{ .Values.database.provider | quote }}
            {{- if eq .Values.database.provider "sqlite" }}
            - name: DB_SQLITE_PATH
              value: {{ required "database.sqlite.path is required for SQLite" .Values.database.sqlite.path | quote }}
            {{- else if eq .Values.database.provider "postgres" }}
            {{- $postgres := .Values.database.postgres }}
            {{- if not $postgres.existingSecret }}
            {{- fail "database.postgres.existingSecret is required for PostgreSQL" }}
            {{- end }}
            {{- if eq $postgres.connectionMode "url" }}
            - name: DB_POSTGRES_URL
              valueFrom:
                secretKeyRef:
                  name: {{ $postgres.existingSecret }}
                  key: {{ required "database.postgres.urlKey is required for PostgreSQL URL mode" $postgres.urlKey }}
            {{- else if eq $postgres.connectionMode "components" }}
            - name: DB_POSTGRES_HOST
              valueFrom:
                secretKeyRef:
                  name: {{ $postgres.existingSecret }}
                  key: {{ required "database.postgres.hostKey is required for PostgreSQL component mode" $postgres.hostKey }}
            - name: DB_POSTGRES_PORT
              valueFrom:
                secretKeyRef:
                  name: {{ $postgres.existingSecret }}
                  key: {{ required "database.postgres.portKey is required for PostgreSQL component mode" $postgres.portKey }}
            - name: DB_POSTGRES_DATABASE
              valueFrom:
                secretKeyRef:
                  name: {{ $postgres.existingSecret }}
                  key: {{ required "database.postgres.databaseKey is required for PostgreSQL component mode" $postgres.databaseKey }}
            - name: DB_POSTGRES_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ $postgres.existingSecret }}
                  key: {{ required "database.postgres.usernameKey is required for PostgreSQL component mode" $postgres.usernameKey }}
            - name: DB_POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $postgres.existingSecret }}
                  key: {{ required "database.postgres.passwordKey is required for PostgreSQL component mode" $postgres.passwordKey }}
            {{- else }}
            {{- fail "database.postgres.connectionMode must be url or components" }}
            {{- end }}
            {{- end }}
            {{- with .Values.auth.initialAdmin }}
            {{- if .existingSecret }}
            - name: INITIAL_ADMIN_EMAIL
              valueFrom:
                secretKeyRef:
                  name: {{ .existingSecret }}
                  key: {{ required "auth.initialAdmin.key is required when auth.initialAdmin.existingSecret is set" .key }}
            {{- end }}
            {{- end }}
            {{- if $monitoring.enabled }}
            - name: USAGE_MONITORING_GOOGLE_ENABLED
              value: "true"
            - name: GOOGLE_CLOUD_PROJECT_ID
              value: {{ required "usageMonitoring.googleCloud.projectId is required when Google monitoring is enabled" $monitoring.projectId | quote }}
            - name: GOOGLE_MAPS_MONITORED_SERVICES
              value: {{ required "usageMonitoring.googleCloud.monitoredServices must contain at least one service" (join "," $monitoring.monitoredServices) | quote }}
            {{- if $workloadIdentity.enabled }}
            - name: GOOGLE_APPLICATION_CREDENTIALS
              value: /etc/workload-identity/credential-configuration.json
            {{- end }}
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with .Values.extraEnvFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          {{- if or .Values.persistence.enabled $workloadIdentity.enabled }}
          volumeMounts:
            {{- if .Values.persistence.enabled }}
            - name: data
              mountPath: {{ .Values.persistence.mountPath }}
            {{- end }}
            {{- if $workloadIdentity.enabled }}
            - name: google-workload-identity-token
              mountPath: /var/run/service-account
              readOnly: true
            - name: google-workload-identity-config
              mountPath: /etc/workload-identity
              readOnly: true
            {{- end }}
          {{- end }}
      {{- if or .Values.persistence.enabled $workloadIdentity.enabled }}
      volumes:
        {{- if .Values.persistence.enabled }}
        - name: data
          persistentVolumeClaim:
            claimName: mungchilog-data
        {{- end }}
        {{- if $workloadIdentity.enabled }}
        - name: google-workload-identity-token
          projected:
            sources:
              - serviceAccountToken:
                  audience: {{ required "usageMonitoring.googleCloud.workloadIdentity.audience is required" $workloadIdentity.audience | quote }}
                  expirationSeconds: {{ $workloadIdentity.tokenExpirationSeconds }}
                  path: token
        - name: google-workload-identity-config
          configMap:
            name: {{ required "usageMonitoring.googleCloud.workloadIdentity.credentialConfigMap is required" $workloadIdentity.credentialConfigMap }}
            items:
              - key: {{ required "usageMonitoring.googleCloud.workloadIdentity.credentialConfigKey is required" $workloadIdentity.credentialConfigKey }}
                path: credential-configuration.json
        {{- end }}
      {{- end }}
