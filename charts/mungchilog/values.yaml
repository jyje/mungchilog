image:
  repository: ghcr.io/jyje/mungchilog
  # Empty resolves to Chart.appVersion, the workload version this chart
  # revision was tested against. Set an explicit immutable tag
  # (`v<major>.<minor>.<patch>` or `v<version>-r<run>-<sha>`) to pin a
  # different build. Never `latest`: the promotion workflow does not publish
  # it, and the one left in the registry predates the release contract.
  tag: ""
  # Strongest pin: `sha256:...`. Takes precedence over `tag`, which is then
  # kept in the reference only for readability.
  digest: ""
  pullPolicy: IfNotPresent

replicaCount: 1

# Location sharing keeps coordinates only in the running server's memory. Keep
# it disabled unless the release is intentionally configured as one process
# with a non-overlapping replacement. Enabling this value makes the Deployment
# use Recreate so an old and a new pod cannot serve location traffic together.
locationSharing:
  enabled: false

serviceAccount:
  # Create a dedicated Kubernetes ServiceAccount when the workload needs
  # federated access to Google Cloud. No Google service account key is used.
  create: false
  name: ""
  annotations: {}
  automountServiceAccountToken: false

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 300m
    memory: 256Mi

service:
  port: 80
  targetPort: 3000

ingress:
  enabled: true
  className: nginx
  # Additional labels for ingress-based integrations such as dashboards.
  labels: {}
  annotations: {}
  host: mungchilog.example.com
  tlsSecretName: mungchilog-tls
  publicPaths: []

# DB_PROVIDER is the only shared selector. Every provider-specific value uses
# its own namespace so no SQLite or PostgreSQL credential can be ambiguous.
database:
  provider: sqlite
  sqlite:
    path: /app/data/mungchilog.db
  postgres:
    # Select `url` for a DB_POSTGRES_URL secret key, or `components` for the
    # DB_POSTGRES_HOST/PORT/DATABASE/USERNAME/PASSWORD secret keys.
    connectionMode: url
    existingSecret: ""
    urlKey: DB_POSTGRES_URL
    hostKey: DB_POSTGRES_HOST
    portKey: DB_POSTGRES_PORT
    databaseKey: DB_POSTGRES_DATABASE
    usernameKey: DB_POSTGRES_USERNAME
    passwordKey: DB_POSTGRES_PASSWORD

auth:
  initialAdmin:
    # The comma-separated initial administrator email list is personal data.
    # Reference a Secret instead of placing the value in Helm values or Git.
    existingSecret: ""
    key: INITIAL_ADMIN_EMAIL

usageMonitoring:
  googleCloud:
    enabled: false
    projectId: ""
    monitoredServices:
      - maps-backend.googleapis.com
      - places.googleapis.com
      - routes.googleapis.com
      - timezone-backend.googleapis.com
    workloadIdentity:
      enabled: false
      # The audience expected by the Google Cloud workload identity provider.
      audience: ""
      # A gcloud-generated external-account credential configuration contains
      # no private key and can be stored in a ConfigMap.
      credentialConfigMap: ""
      credentialConfigKey: credential-configuration.json
      tokenExpirationSeconds: 3600

persistence:
  enabled: true
  storageClassName: ""
  size: 1Gi
  mountPath: /app/data

# One-off data migration Jobs, rendered as ArgoCD PreSync hooks. Disabled
# by default - each one is an explicit operational action, not something a
# routine sync should trigger. See
# docs/migrations/2026-spot-planned-departure.md for how and when to run
# spotTimeFields in a given environment.
migration:
  spotTimeFields:
    enabled: false
    # Report what would change without writing anything.
    dryRun: false

# Use these for application settings outside the database block, for example
# OIDC variables or values from an existing sealed secret.
extraEnv: []
extraEnvFrom: []
extraResources: []
